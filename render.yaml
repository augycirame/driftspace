# Render Blueprint: one web service runs the game server and serves the client.
# The persistent disk keeps the world (player builds, mined asteroids, pilots) across
# deploys and restarts. Disks need a paid instance type; without one, delete the `disk`
# block, set plan: free, and the world resets on every deploy or restart.
services:
  - type: web
    name: driftspace
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SEED
        value: "1337"
      - key: DATA_FILE
        value: /var/data/world.json
      # Your pilot name(s), comma-separated, to unlock admin chat commands. Set it in the
      # Render dashboard (Environment tab); it isn't stored in this file.
      - key: ADMIN
        sync: false
      # Optional: a Claude API key lets townsfolk hold real conversations and lets the AI
      # director run the galaxy. It is billed per call, so it also needs AI_ENABLED=1 (off by
      # default). Without them, NPCs use scripted dialogue. Set both in the dashboard; they
      # aren't stored here. NPC_MODEL and AI_DAILY_LIMIT tune model and cost.
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: world
      mountPath: /var/data
      sizeGB: 1
